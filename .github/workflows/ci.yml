name: keyina-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            global.json

      - name: Build .NET host (Debug)
        run: dotnet build Keyina.slnx -c Debug
      - name: Test .NET host (Debug)
        run: dotnet run --project apps/host/Keyina.Host.Tests/Keyina.Host.Tests.csproj -c Debug --no-build
      - name: Host self-test
        run: dotnet run --project apps/host/Keyina.Host/Keyina.Host.csproj -c Debug --no-build -- --self-test
      - name: Speech self-test (offline)
        run: dotnet run --project apps/host/Keyina.Host/Keyina.Host.csproj -c Debug --no-build -- --speech-self-test
      - name: Build .NET host (Release)
        run: dotnet build Keyina.slnx -c Release
      - name: Test .NET host (Release)
        run: dotnet run --project apps/host/Keyina.Host.Tests/Keyina.Host.Tests.csproj -c Release --no-build
      - name: Host resource probe
        shell: pwsh
        run: |
          dotnet run --project apps/host/Keyina.Host/Keyina.Host.csproj -c Release --no-build -- --resource-self-test |
            Out-File -Encoding utf8 host-resource-result.json
          Get-Content host-resource-result.json -Raw | ConvertFrom-Json | Out-Null
      - name: Run host and speech benchmarks
        shell: pwsh
        run: |
          dotnet run --project apps/host/Keyina.Host.Benchmarks/Keyina.Host.Benchmarks.csproj -c Release --no-build |
            Out-File -Encoding utf8 host-benchmark-result.json
          Get-Content host-benchmark-result.json -Raw | ConvertFrom-Json | Out-Null
      - name: Regenerate brand assets
        run: dotnet run --project tools/brand/Keyina.BrandAssets/Keyina.BrandAssets.csproj -c Release --no-build -- generate --root ${{ github.workspace }}
      - name: Verify deterministic brand tree
        shell: pwsh
        run: git diff --exit-code -- docs/brand brand

      - name: Configure native Debug
        run: cmake --preset windows-msvc-debug
      - name: Build native Debug
        run: cmake --build --preset windows-msvc-debug
      - name: Test native Debug
        run: ctest --preset windows-msvc-debug --output-on-failure
      - name: Validate golden vectors
        run: python tools/check_vectors.py
      - name: Test benchmark comparator
        run: python tools/test_compare_benchmark.py

      - name: Configure native Release
        run: cmake --preset windows-msvc-release
      - name: Build native Release
        run: cmake --build --preset windows-msvc-release
      - name: Test native Release
        run: ctest --preset windows-msvc-release --output-on-failure
      - name: Run release benchmark
        shell: pwsh
        run: |
          .\build\windows-msvc-release\benchmarks\Release\keyina_bench.exe |
            Out-File -Encoding utf8 benchmark-result.json
          python -m json.tool benchmark-result.json | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: windows-performance-evidence
          path: |
            benchmark-result.json
            host-benchmark-result.json
            host-resource-result.json

  linux-clang-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-clang-asan
      - name: Build
        run: cmake --build --preset linux-clang-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset linux-clang-asan --output-on-failure
